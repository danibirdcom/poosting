services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: redactia-postgres
    environment:
      POSTGRES_USER: redactia
      POSTGRES_PASSWORD: redactia
      POSTGRES_DB: redactia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redactia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redactia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: redactia-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: redactia-api
    environment:
      DATABASE_URL: postgresql://redactia:redactia@postgres:5432/redactia
      REDIS_URL: redis://redis:6379/0
      APP_ENV: dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
    profiles: ["full"]

  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: redactia-workers
    environment:
      DATABASE_URL: postgresql://redactia:redactia@postgres:5432/redactia
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./workers/src:/app/src
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
